<title>WRMax Demandas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: app shell — sidebar (desktop) / barra inferior (celular), quadro de 5 colunas, gaveta lateral para o detalhe.
   Tokens: WRMax Design System v1 (escuro é o padrão; claro troca só valores). */
:root{
  --fundo:#0a0907; --superficie:#15130e; --superficie-2:#1d1a13; --campo:#100e0a;
  --texto:#f1e8d6; --texto-apagado:#ac9f84; --texto-inativo:#8c836f;
  --linha:rgba(232,199,122,.11); --linha-2:rgba(232,199,122,.24);
  --dourado:#d4b06a; --ouro:#e8c77a; --ouro-escuro:#8a6420; --ouro-claro:#f8e6b0; --texto-sobre-ouro:#1a1408;
  --ouro-rgb:232 199 122; --ouro-texto:#e8c77a;
  --ok:#6fd39b; --atencao:#e7b45a; --erro:#ff6b8a;
  --ok-fundo:rgba(111,211,155,.1); --atencao-fundo:rgba(231,180,90,.11); --erro-fundo:rgba(255,107,138,.1);
  --brilho-fundo:rgba(201,151,58,.14); --grade-fundo:rgba(232,199,122,.05);
  --scrim:rgba(4,3,2,.72); --sombra-flutuante:0 22px 44px -12px rgba(0,0,0,.7);
  --vidro:rgba(10,9,7,.72); --logo-filtro:none;
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-texto:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --raio-chip:9px; --raio-botao:10px; --raio-card:14px; --raio-painel:18px;
  --ease-mac:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --fundo:#f6f1e6; --superficie:#fdfaf3; --superficie-2:#f1eadb; --campo:#fbf7ee;
    --texto:#1d1912; --texto-apagado:#5c5242; --texto-inativo:#6f6553;
    --linha:rgba(138,100,32,.16); --linha-2:rgba(138,100,32,.3);
    --dourado:#8a6420; --ouro-rgb:176 127 34; --ouro-texto:#8a6420;
    --ok:#17744a; --atencao:#8f5c06; --erro:#b8304f;
    --ok-fundo:rgba(23,116,74,.09); --atencao-fundo:rgba(143,92,6,.09); --erro-fundo:rgba(184,48,79,.08);
    --brilho-fundo:rgba(201,151,58,.12); --grade-fundo:rgba(138,100,32,.07);
    --scrim:rgba(29,25,18,.4); --sombra-flutuante:0 18px 36px -14px rgba(60,44,14,.28);
    --vidro:rgba(246,241,230,.8); --logo-filtro:brightness(0) saturate(100%) opacity(.88);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --fundo:#f6f1e6; --superficie:#fdfaf3; --superficie-2:#f1eadb; --campo:#fbf7ee;
  --texto:#1d1912; --texto-apagado:#5c5242; --texto-inativo:#6f6553;
  --linha:rgba(138,100,32,.16); --linha-2:rgba(138,100,32,.3);
  --dourado:#8a6420; --ouro-rgb:176 127 34; --ouro-texto:#8a6420;
  --ok:#17744a; --atencao:#8f5c06; --erro:#b8304f;
  --ok-fundo:rgba(23,116,74,.09); --atencao-fundo:rgba(143,92,6,.09); --erro-fundo:rgba(184,48,79,.08);
  --brilho-fundo:rgba(201,151,58,.12); --grade-fundo:rgba(138,100,32,.07);
  --scrim:rgba(29,25,18,.4); --sombra-flutuante:0 18px 36px -14px rgba(60,44,14,.28);
  --vidro:rgba(246,241,230,.8); --logo-filtro:brightness(0) saturate(100%) opacity(.88);
  color-scheme:light;
}

/* Tons do escuro (configuração por pessoa) */
:root[data-theme="dark"][data-tom="neutro"]{--fundo:#0c0c0d;--superficie:#161618;--superficie-2:#1f1f23;--campo:#111113;--vidro:rgba(12,12,13,.75)}
@media (prefers-color-scheme: dark){:root:not([data-theme])[data-tom="neutro"]{--fundo:#0c0c0d;--superficie:#161618;--superficie-2:#1f1f23;--campo:#111113;--vidro:rgba(12,12,13,.75)}}
:root[data-theme="dark"][data-tom="profundo"]{--fundo:#000000;--superficie:#0c0b09;--superficie-2:#16140f;--campo:#060504;--vidro:rgba(0,0,0,.78)}
@media (prefers-color-scheme: dark){:root:not([data-theme])[data-tom="profundo"]{--fundo:#000000;--superficie:#0c0b09;--superficie-2:#16140f;--campo:#060504;--vidro:rgba(0,0,0,.78)}}
:root[data-theme="dark"][data-tom="suave"]{--fundo:#1b1915;--superficie:#24211b;--superficie-2:#2e2a22;--campo:#1f1c17;--vidro:rgba(27,25,21,.78)}
@media (prefers-color-scheme: dark){:root:not([data-theme])[data-tom="suave"]{--fundo:#1b1915;--superficie:#24211b;--superficie-2:#2e2a22;--campo:#1f1c17;--vidro:rgba(27,25,21,.78)}}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--fundo); color:var(--texto); font-family:var(--f-texto); font-size:14px; line-height:1.5;
  background-image:radial-gradient(60rem 40rem at 100% 0%,var(--brilho-fundo),transparent 60%),radial-gradient(var(--grade-fundo) 1px,transparent 1px);
  background-size:auto,24px 24px; background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--dourado);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.etiqueta{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-inativo)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--texto-apagado)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--raio-botao);
  border:1px solid var(--linha-2);background:rgb(var(--ouro-rgb)/.04);color:var(--texto);font-weight:500;white-space:nowrap;
  transition:background .2s var(--ease-mac),border-color .2s var(--ease-mac),transform .1s}
.btn:hover{background:rgb(var(--ouro-rgb)/.09);border-color:rgb(var(--ouro-rgb)/.4)}
.btn:active{transform:scale(.985)}
.btn.ouro{border:0;color:#1a1408;font-weight:600;background:linear-gradient(100deg,#8a6420 0%,#e8c77a 45%,#f8e6b0 70%,#e8c77a 100%);background-size:200% 100%;background-position:0 0;box-shadow:0 8px 24px -8px rgba(201,151,58,.45)}
.btn.ouro:hover{background-position:100% 0}
.btn.ghost{border-color:transparent;background:transparent;color:var(--texto-apagado)}
.btn.ghost:hover{color:var(--texto);background:rgb(var(--ouro-rgb)/.06)}
.btn.perigo{color:var(--erro);border-color:color-mix(in srgb,var(--erro) 40%,transparent)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.icone{width:34px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Campos */
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo label{font-size:12px;font-weight:500;color:var(--texto-apagado)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=url],select,textarea{
  width:100%;background:var(--campo);border:1px solid var(--linha-2);border-radius:var(--raio-botao);padding:9px 11px;min-height:38px;outline:none}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--dourado);box-shadow:0 0 0 3px rgb(var(--ouro-rgb)/.15)}
.erro-txt{color:var(--erro);font-size:12.5px}

/* Status: ponto + texto */
.dot{width:7px;height:7px;border-radius:50%;background:var(--texto-inativo);flex:none}
.t-erro .dot,.dot.t-erro{background:var(--erro)} .t-atencao .dot,.dot.t-atencao{background:var(--atencao)} .t-ok .dot,.dot.t-ok{background:var(--ok)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--texto-apagado);white-space:nowrap}
.selo{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid var(--linha)}
.selo.t-erro{background:var(--erro-fundo);color:var(--erro);border-color:transparent}
.selo.t-atencao{background:var(--atencao-fundo);color:var(--atencao);border-color:transparent}
.selo.t-ok{background:var(--ok-fundo);color:var(--ok);border-color:transparent}
.selo.t-neutro{color:var(--texto-apagado)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:var(--raio-chip);font-size:12px;background:var(--superficie-2);color:var(--texto-apagado);white-space:nowrap}
.chip-ouro{background:rgb(var(--ouro-rgb)/.1);border:1px solid rgb(var(--ouro-rgb)/.35);color:var(--ouro-texto)}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:600;background:rgb(var(--ouro-rgb)/.14);color:var(--ouro-texto);flex:none;font-family:var(--f-mono)}

/* Shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.app.sem-nav{grid-template-columns:minmax(0,1fr)}
.lateral{position:sticky;top:0;height:100vh;height:100dvh;border-right:1px solid var(--linha);background:var(--vidro);backdrop-filter:blur(14px);display:flex;flex-direction:column;padding:20px 14px;gap:22px}
.logo{height:20px;width:auto;filter:var(--logo-filtro);display:block}
.marca{display:flex;flex-direction:column;gap:6px;padding:0 8px}
.marca .etiqueta{font-size:10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--raio-botao);border:1px solid transparent;background:none;color:var(--texto-apagado);text-align:left;font-weight:500}
.nav button:hover{color:var(--texto);background:rgb(var(--ouro-rgb)/.05)}
.nav button.ativo{color:var(--texto);background:rgb(var(--ouro-rgb)/.09);border-color:rgb(var(--ouro-rgb)/.22)}
.nav button.ativo svg{color:var(--dourado)}
.nav .badge{margin-left:auto;font-family:var(--f-mono);font-size:11px;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:rgb(var(--ouro-rgb)/.16);color:var(--ouro-texto)}
.lateral .rodape{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.proto-aviso{font-size:12px;color:var(--texto-inativo);line-height:1.45;padding:10px;border:1px dashed var(--linha-2);border-radius:var(--raio-botao)}

.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--vidro);backdrop-filter:blur(14px);border-bottom:1px solid var(--linha);min-height:62px}
.topo .titulo{display:flex;flex-direction:column;min-width:0}
.topo .titulo h1{font-size:18px}
.topo .titulo .muted{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .acoes{margin-left:auto;display:flex;align-items:center;gap:8px}
.perfil{display:flex;align-items:center;gap:8px;height:38px;padding:0 6px 0 8px;border:1px solid var(--linha);border-radius:999px;background:transparent;color:var(--texto)}
.perfil .nome{font-size:13px;font-weight:500;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perfil .papel{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-inativo)}
.logo-movel{display:none}
.conteudo{padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;min-width:0}

/* Resumo */
.resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:760px}
.resumo .item{border:1px solid var(--linha);background:var(--superficie);border-radius:var(--raio-card);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left}
.resumo .item .n{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.resumo .item.t-erro .n{color:var(--erro)} .resumo .item.t-atencao .n{color:var(--atencao)} .resumo .item.t-ok .n{color:var(--ok)}
.resumo .item .rot{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--texto-apagado)}

.filtros{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.filtros select{width:auto;min-width:160px;max-width:100%}
.filtros .dica{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--texto-inativo);margin-left:auto}

/* Quadro */
.quadro-wrap{overflow-x:auto;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));padding-bottom:8px}
.quadro{display:grid;grid-template-columns:repeat(5,minmax(258px,1fr));gap:12px;min-width:min-content}
.coluna{background:rgb(var(--ouro-rgb)/.025);border:1px solid var(--linha);border-radius:var(--raio-painel);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px;transition:opacity .2s,border-color .2s,background .2s}
.coluna header{display:flex;align-items:center;gap:8px;padding:4px 4px 6px}
.coluna header h2{font-size:13.5px;font-weight:600;font-family:var(--f-texto);letter-spacing:0}
.coluna header .cont{font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo);margin-left:auto}
.coluna .vazio{font-size:12.5px;color:var(--texto-inativo);text-align:center;padding:22px 8px;border:1px dashed var(--linha);border-radius:var(--raio-card)}
.coluna.pode{border-color:rgb(var(--ouro-rgb)/.55);background:rgb(var(--ouro-rgb)/.06)}
.coluna.nao-pode{opacity:.42}
.coluna .bloqueio{display:none;font-size:12px;color:var(--texto-apagado);gap:6px;align-items:center;padding:0 4px}
.coluna.nao-pode .bloqueio{display:flex}

.card{position:relative;background:var(--superficie);border:1px solid var(--linha);border-radius:var(--raio-card);padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;color:var(--texto);transition:border-color .2s var(--ease-mac),transform .2s var(--ease-mac)}
.card:hover{border-color:var(--linha-2)}
.card.arrastando{opacity:.4}
.card .cli{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ouro-texto);display:flex;gap:8px;align-items:center}
.card .cli .cod{color:var(--texto-inativo);margin-left:auto;letter-spacing:.06em}
.card h3{font-family:var(--f-texto);font-size:14px;font-weight:600;line-height:1.35;letter-spacing:0}
.card .linha{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.card .pe{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--texto-inativo)}
.card .meta span{display:inline-flex;align-items:center;gap:4px}
.card .meta svg{width:13px;height:13px}
.card .ajuste{font-size:12.5px;line-height:1.4;background:var(--erro-fundo);color:var(--texto);border-radius:10px;padding:8px 10px}
.card .ajuste b{color:var(--erro);font-weight:600}
.card .ajuste p{margin:2px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--texto-apagado)}
.card .mover{position:absolute;top:8px;right:8px;opacity:0}
.card:hover .mover,.card:focus-within .mover{opacity:1}
.card-abrir{all:unset;position:absolute;inset:0;border-radius:var(--raio-card);cursor:pointer}
.card-abrir:focus-visible{outline:2px solid var(--dourado);outline-offset:2px}
.card > *:not(.card-abrir){position:relative;pointer-events:none}
.card .mover{pointer-events:auto;position:absolute}

.abas-colunas{display:none;overflow-x:auto;gap:6px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.seg{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--linha);border-radius:999px;background:var(--superficie)}
.seg button{height:30px;padding:0 12px;border-radius:999px;border:1px solid transparent;background:none;color:var(--texto-apagado);font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.ativo{background:rgb(var(--ouro-rgb)/.12);border-color:rgb(var(--ouro-rgb)/.35);color:var(--texto)}
.seg button .c{font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo)}

/* Menu flutuante */
.menu{position:fixed;z-index:60;min-width:220px;background:var(--superficie);border:1px solid var(--linha-2);border-radius:var(--raio-card);box-shadow:var(--sombra-flutuante);padding:6px;display:flex;flex-direction:column}
.menu .etiqueta{padding:6px 10px 4px}
.menu button{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;text-align:left;color:var(--texto)}
.menu button:hover{background:rgb(var(--ouro-rgb)/.08)}
.menu .nota{font-size:12px;color:var(--texto-inativo);padding:6px 10px 4px;display:flex;gap:6px;align-items:flex-start;line-height:1.4}

/* Detalhe da demanda: modal grande, duas colunas no desktop */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);z-index:40;animation:fade .2s var(--ease-mac)}
.detalhe{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1060px,calc(100% - 48px));height:min(880px,calc(100% - 48px));background:var(--superficie);border:1px solid var(--linha-2);border-radius:var(--raio-painel);box-shadow:var(--sombra-flutuante);display:flex;flex-direction:column;overflow:hidden;animation:surge .25s var(--ease-mac)}
.detalhe .cab{display:flex;align-items:flex-start;gap:12px;padding:18px 22px 14px;border-bottom:1px solid var(--linha)}
.detalhe .cab .t{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.detalhe .cab h2{font-size:20px;line-height:1.25}
.detalhe .acoes-card{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 22px;border-bottom:1px solid var(--linha);background:rgb(var(--ouro-rgb)/.03)}
.detalhe .acoes-card .regra{font-size:12.5px;color:var(--texto-inativo);display:flex;align-items:center;gap:6px}
.detalhe .corpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.detalhe .col-a,.detalhe .col-b{overflow-y:auto;padding:18px 22px 28px;display:flex;flex-direction:column;gap:22px;min-width:0}
.detalhe .col-b{border-left:1px solid var(--linha);background:rgb(var(--ouro-rgb)/.02)}
.props{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.props div{display:flex;flex-direction:column;gap:4px;min-width:0}
.props .v{font-size:13.5px;display:flex;align-items:center;gap:6px;min-width:0}
.props .largo{grid-column:1/-1}
.pessoas-det{display:flex;flex-direction:column;gap:8px}
.pessoas-det span.p{display:flex;align-items:center;gap:8px;font-size:13.5px;flex-wrap:wrap}
.pessoas-det small{font-size:11.5px;color:var(--texto-inativo)}
@keyframes surge{from{opacity:0;transform:translate(-50%,-48%) scale(.985)}to{opacity:1;transform:translate(-50%,-50%)}}

/* Compartilhados, freelancers, painel, convites, histórico */
.avs{display:inline-flex}
.avs .avatar{width:22px;height:22px;font-size:9.5px;border:2px solid var(--superficie);margin-left:-6px}
.avs .avatar:first-child{margin-left:0}
.chip-free{background:transparent;border:1px solid var(--linha-2);color:var(--texto-apagado)}
.colegas{display:flex;flex-wrap:wrap;gap:8px}
.colega{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 7px;border:1px solid var(--linha);border-radius:999px;background:var(--superficie);text-align:left;color:var(--texto)}
.colega > span:last-child{display:flex;flex-direction:column;line-height:1.25}
.colega b{font-weight:500;font-size:13px}
.colega small{font-size:11.5px;color:var(--texto-inativo)}
.colega:hover{border-color:var(--linha-2)}
.colega.ativo{border-color:rgb(var(--ouro-rgb)/.5);background:rgb(var(--ouro-rgb)/.08)}
.kpi .btn{align-self:flex-start;margin-top:8px}
.grupos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grupos .g{display:flex;flex-direction:column;gap:10px;min-width:0}
.linhas-dem{display:flex;flex-direction:column;border:1px solid var(--linha);border-radius:var(--raio-card);overflow:hidden}
.linha-dem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--linha);background:var(--campo);text-align:left;color:var(--texto);width:100%}
.linha-dem:last-child{border-bottom:0}
.linha-dem:hover{background:rgb(var(--ouro-rgb)/.05)}
.linha-dem .cod{font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo)}
.linha-dem .tt{display:flex;flex-direction:column;min-width:0}
.linha-dem .tt b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha-dem .tt small{font-size:12px;color:var(--texto-apagado);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linha-dem .ex{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.link-box{display:flex;gap:8px}
.link-box input{font-family:var(--f-mono);font-size:12.5px}
.aviso-box{border:1px solid var(--linha);background:var(--campo);border-radius:var(--raio-card);padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--texto-apagado);line-height:1.5}
.aviso-box b{color:var(--texto);font-weight:500}
.tela-senha{border:1px solid var(--linha-2);border-radius:var(--raio-card);padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--fundo)}
.tela-senha .url{font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-filtros{align-items:flex-end}
.hist-filtros .campo.mini{flex:0 0 150px}
.hist-resumo{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--texto-apagado)}
.hist-resumo b{color:var(--texto);font-variant-numeric:tabular-nums}
.cad-lista .acoes-it{display:flex;gap:6px;flex-wrap:wrap}
.secao{display:flex;flex-direction:column;gap:10px}
.secao > header{display:flex;align-items:center;gap:8px}
.secao > header h3{font-size:14px;font-family:var(--f-texto);font-weight:600;letter-spacing:0}
.secao > header .cont{font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo)}
.briefing{white-space:pre-wrap;line-height:1.6;color:var(--texto);max-width:65ch;margin:0}
.destaque-ajuste{border-radius:var(--raio-card);background:var(--erro-fundo);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.destaque-ajuste .top{display:flex;align-items:center;gap:8px;color:var(--erro);font-weight:600;font-size:13px}
.destaque-ajuste p{margin:0;line-height:1.55}
.destaque-ajuste .quem{font-size:12px;color:var(--texto-apagado)}

.arquivos{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.arq{border:1px solid var(--linha);border-radius:12px;background:var(--campo);overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;color:var(--texto)}
.arq:hover{border-color:var(--linha-2)}
.arq .thumb{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--superficie-2);color:var(--texto-inativo);overflow:hidden}
.arq .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.arq .thumb svg{width:28px;height:28px}
.arq .thumb .ext{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;margin-top:4px}
.arq .thumb .pilha{display:flex;flex-direction:column;align-items:center}
.arq .info{padding:7px 9px;display:flex;flex-direction:column;min-width:0}
.arq .info .n{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arq .info .s{font-size:11px;color:var(--texto-inativo);font-family:var(--f-mono)}

.check{display:flex;flex-direction:column;gap:2px}
.check label{display:flex;align-items:flex-start;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer}
.check label:hover{background:rgb(var(--ouro-rgb)/.05)}
.check input{accent-color:var(--dourado);width:16px;height:16px;margin-top:2px;flex:none}
.check .feito{color:var(--texto-inativo);text-decoration:line-through}
.barra{height:4px;border-radius:999px;background:var(--superficie-2);overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,#8a6420,#e8c77a)}
.add-linha{display:flex;gap:8px}

.versoes{display:flex;flex-direction:column;gap:10px}
.versao{border:1px solid var(--linha);border-radius:var(--raio-card);padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--campo)}
.versao .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.versao .v{font-family:var(--f-display);font-weight:700;font-size:15px}
.versao .nota{margin:0;color:var(--texto-apagado);line-height:1.5}
.versao .revisao{font-size:12.5px;border-top:1px solid var(--linha);padding-top:8px;color:var(--texto-apagado)}

.video{border-radius:12px;overflow:hidden;border:1px solid var(--linha);background:#0d0b08;color:#f1e8d6}
.video .tela{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(232,199,122,.18),transparent 60%),#0d0b08;position:relative}
.video .play{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(241,232,214,.12);border:1px solid rgba(241,232,214,.25)}
.video .play svg{width:20px;height:20px;fill:#f1e8d6;stroke:none;margin-left:3px}
.video .tag{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(241,232,214,.7)}
.video .rod{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;background:var(--superficie-2);color:var(--texto-apagado)}
.video .rod a{color:var(--ouro-texto);margin-left:auto;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.video .rod a svg{width:13px;height:13px}
.mini-video{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--texto-apagado)}

.comentarios{display:flex;flex-direction:column;gap:12px}
.coment{display:flex;gap:10px}
.coment .b{display:flex;flex-direction:column;gap:2px;min-width:0}
.coment .q{font-size:12.5px;color:var(--texto-apagado)}
.coment .q b{color:var(--texto);font-weight:600}
.coment p{margin:0;line-height:1.5;overflow-wrap:anywhere}
.coment.ajuste p{background:var(--erro-fundo);padding:8px 10px;border-radius:10px}
.linha-tempo{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--linha-2);margin-left:6px}
.linha-tempo div{position:relative;padding:0 0 12px 16px;font-size:13px;color:var(--texto-apagado)}
.linha-tempo div::before{content:"";position:absolute;left:-4px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--superficie);border:1px solid var(--dourado)}
.linha-tempo b{color:var(--texto);font-weight:500}
.linha-tempo .q{font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo);display:block}

/* Modal */
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:calc(100% - 40px);background:var(--superficie);border:1px solid var(--linha-2);border-radius:var(--raio-painel);box-shadow:var(--sombra-flutuante);display:flex;flex-direction:column;animation:fade .2s var(--ease-mac)}
.modal.largo{width:min(880px,calc(100% - 32px))}
.modal .cab{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px}
.modal .cab .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.modal .cab h2{font-size:18px}
.modal .corpo{padding:4px 20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal .rod{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:14px 20px;border-top:1px solid var(--linha);flex-wrap:wrap}
.modal .rod .info{margin-right:auto;font-size:12.5px;color:var(--texto-inativo)}
.scrim.alto{z-index:50}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.zona{border:1.5px dashed var(--linha-2);border-radius:var(--raio-card);padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--texto-apagado);background:var(--campo);cursor:pointer;transition:border-color .2s,background .2s}
.zona:hover,.zona.sobre{border-color:var(--dourado);background:rgb(var(--ouro-rgb)/.05)}
.zona svg{width:22px;height:22px;color:var(--dourado)}
.zona b{color:var(--texto);font-weight:600}
.zona small{font-size:12px;color:var(--texto-inativo)}
.lista-arq{display:flex;flex-direction:column;gap:6px}
.lista-arq .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--linha);border-radius:10px;background:var(--campo)}
.lista-arq .it .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.lista-arq .it .s{font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo)}
.lista-arq .it.rej{border-color:transparent;background:var(--erro-fundo)}
.lista-arq .it.rej .n{color:var(--texto)}
.lista-arq .it.rej .motivo{font-size:12px;color:var(--erro)}
.lista-arq img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:none}
.prev-pdf{aspect-ratio:1/1.3;max-width:100%;width:min(420px,100%);margin:0 auto;background:#fdfaf3;color:#1d1912;border-radius:6px;padding:28px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.prev-pdf .l{height:8px;border-radius:4px;background:#e6dcc8}
.prev-pdf h4{margin:0;font-family:var(--f-display);font-size:18px}
.prev-img{max-width:100%;max-height:60vh;display:block;margin:0 auto;border-radius:10px}

/* Painel / tabelas */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border:1px solid var(--linha);background:var(--superficie);border-radius:var(--raio-card);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .n{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1}
.kpi .d{font-size:12.5px;color:var(--texto-apagado)}
.kpi.t-erro .n{color:var(--erro)}
.paineis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.painel{border:1px solid var(--linha);background:var(--superficie);border-radius:var(--raio-painel);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.painel > header{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.painel > header h2{font-size:15px}
.painel > header .muted{font-size:12.5px}
.tabela-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--f-mono);font-weight:400;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-inativo);text-align:left;padding:6px 8px;border-bottom:1px solid var(--linha);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--linha);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.barras{display:flex;flex-direction:column;gap:10px}
.barras .b{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.barras .b .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barras .trilho{height:10px;border-radius:999px;background:var(--superficie-2);overflow:hidden;display:flex}
.barras .trilho i{display:block;height:100%}
.barras .trilho i.a{background:linear-gradient(90deg,#8a6420,#e8c77a)}
.barras .trilho i.r{background:var(--erro);opacity:.75}
.barras .val{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--texto-apagado)}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--texto-apagado);flex-wrap:wrap}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}

.fila{display:flex;flex-direction:column;gap:12px}
.fila-item{border:1px solid var(--linha);background:var(--superficie);border-radius:var(--raio-painel);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px}
.fila-item .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.fila-item h3{font-family:var(--f-texto);font-size:15.5px;font-weight:600;letter-spacing:0}
.fila-item .botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.vazio-grande{border:1px dashed var(--linha-2);border-radius:var(--raio-painel);padding:40px 20px;text-align:center;color:var(--texto-apagado);display:flex;flex-direction:column;gap:6px;align-items:center}
.vazio-grande h3{font-size:16px;color:var(--texto)}

.dupla{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start}
.lista-cli{display:flex;flex-direction:column;gap:4px;border:1px solid var(--linha);background:var(--superficie);border-radius:var(--raio-painel);padding:8px}
.lista-cli button{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;color:var(--texto-apagado)}
.lista-cli button .c{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo)}
.lista-cli button.ativo{color:var(--texto);background:rgb(var(--ouro-rgb)/.09);border-color:rgb(var(--ouro-rgb)/.22)}
.hist{display:flex;flex-direction:column;gap:10px}
.hist-item{border:1px solid var(--linha);background:var(--superficie);border-radius:var(--raio-card);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--texto);width:100%}
.hist-item .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hist-item h3{font-family:var(--f-texto);font-size:14.5px;font-weight:600;letter-spacing:0}
.mini-arq{display:flex;gap:6px;flex-wrap:wrap}
.mini-arq .m{width:56px;height:42px;border-radius:7px;overflow:hidden;background:var(--superficie-2);display:grid;place-items:center;color:var(--texto-inativo);font-family:var(--f-mono);font-size:10px}
.mini-arq .m img{width:100%;height:100%;object-fit:cover}

.cad-lista{display:flex;flex-direction:column}
.cad-lista .it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--linha);flex-wrap:wrap}
.cad-lista .it:last-child{border-bottom:0}
.cad-lista .it .n{flex:1;min-width:140px}
.cad-lista .it.inativo .n{color:var(--texto-inativo);text-decoration:line-through}
.cad-lista select{width:auto}
.form-linha{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.form-linha .campo{flex:1;min-width:160px}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .caixa{width:min(440px,100%);display:flex;flex-direction:column;gap:20px}
.login .logo{height:26px}
.login h1{font-size:28px;line-height:1.2}
.login .card-login{border:1px solid var(--linha);background:var(--superficie);border-radius:var(--raio-painel);padding:20px;display:flex;flex-direction:column;gap:12px}
.login .perfis{display:flex;flex-direction:column;gap:6px}
.login .perfis button{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--linha);border-radius:12px;background:var(--campo);text-align:left;color:var(--texto)}
.login .perfis button:hover{border-color:var(--linha-2);background:rgb(var(--ouro-rgb)/.05)}
.login .perfis button .p{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-inativo)}
.login .perfis button .d{display:flex;flex-direction:column;line-height:1.3}
.login .perfis button .d small{color:var(--texto-inativo);font-size:12px}

.toast{position:fixed;z-index:70;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--superficie);border:1px solid var(--linha-2);box-shadow:var(--sombra-flutuante);border-radius:12px;padding:10px 14px;display:flex;gap:8px;align-items:center;font-size:13.5px;max-width:calc(100% - 32px);animation:sobe .3s var(--ease-mac)}
.toast svg{color:var(--ok)}
.toast.aviso svg{color:var(--atencao)}

.nav-baixo{display:none}

/* Avatar com foto, prioridade, recolher, menu do usuário, configurações, histórico, onboarding */
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.g{width:36px;height:36px;font-size:12px}
.avatar.xl{width:64px;height:64px;font-size:20px}
.prio-dot{width:12px;height:12px;border-radius:50%;background:var(--texto-inativo);flex:none;display:inline-block}
.prio-dot.t-erro{background:var(--erro)}
.prio-dot.t-atencao{background:var(--atencao)}
.recolher{all:unset;display:flex;align-items:center;gap:8px;cursor:pointer;width:100%;border-radius:6px}
.recolher:focus-visible{outline:2px solid var(--dourado);outline-offset:3px}
.recolher h3{font-size:14px;font-family:var(--f-texto);font-weight:600;letter-spacing:0}
.recolher .cont{font-family:var(--f-mono);font-size:11px;color:var(--texto-inativo)}
.recolher svg{margin-left:auto;color:var(--texto-inativo);transition:transform .25s var(--ease-mac)}
.recolher[aria-expanded="false"] svg{transform:rotate(-90deg)}
.perfil svg{color:var(--texto-inativo);width:14px;height:14px}
.menu-user{min-width:260px}
.menu-cab{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;border-bottom:1px solid var(--linha);margin-bottom:4px}
.menu-cab span{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.menu-cab b{font-weight:600;font-size:13.5px}
.menu-cab small{color:var(--texto-inativo);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foto-linha{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tom{display:flex;flex-direction:column;gap:3px;padding:10px;border:1px solid var(--linha);border-radius:var(--raio-card);background:var(--campo);text-align:left;color:var(--texto)}
.tom:hover{border-color:var(--linha-2)}
.tom.ativo{border-color:rgb(var(--ouro-rgb)/.6);box-shadow:0 0 0 3px rgb(var(--ouro-rgb)/.14)}
.tom .amostra{display:flex;height:34px;border-radius:8px;overflow:hidden;margin-bottom:5px;border:1px solid var(--linha)}
.tom .amostra i{flex:1}
.tom .amostra i:last-child{flex:.35}
.tom b{font-weight:600;font-size:13px}
.tom small{font-size:12px;color:var(--texto-apagado)}
.busca-campo{position:relative;flex:1 1 300px;min-width:0}
.busca-campo svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--texto-inativo);pointer-events:none}
.busca-campo input{padding-left:34px}
.cal-wrap{position:relative}
.btn.ativo-cal{border-color:rgb(var(--ouro-rgb)/.55);background:rgb(var(--ouro-rgb)/.1)}
.pop-cal{position:absolute;z-index:35;top:calc(100% + 6px);right:0;width:min(340px,calc(100vw - 32px));background:var(--superficie);border:1px solid var(--linha-2);border-radius:var(--raio-card);box-shadow:var(--sombra-flutuante);padding:14px;display:flex;flex-direction:column;gap:12px}
.onb-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--linha)}
.onb-cab p{margin:0;max-width:62ch;color:var(--texto-apagado);font-size:13px;line-height:1.5}
.onb{display:flex;flex-direction:column;gap:3px;min-width:200px}
.onb .status{white-space:normal}
.onb a{color:var(--ouro-texto);text-decoration:none;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.onb a:hover{text-decoration:underline}
.onb a svg{width:13px;height:13px}
/* Colaboração compacta, freelancers na aprovação, base do cliente */
.avatar.p{width:20px;height:20px;font-size:9px}
.colab{display:flex;flex-direction:column;gap:8px}
.colab-sel{display:flex;flex-wrap:wrap;gap:6px}
.chip-pessoa{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 5px;border-radius:999px;background:rgb(var(--ouro-rgb)/.1);border:1px solid rgb(var(--ouro-rgb)/.3);font-size:13px}
.chip-pessoa button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--texto-apagado)}
.chip-pessoa button:hover{background:rgb(var(--ouro-rgb)/.15);color:var(--texto)}
.chip-pessoa button:focus-visible{outline:2px solid var(--dourado)}
.chip-pessoa button svg{width:13px;height:13px}
.colab-busca{position:relative;max-width:420px}
.colab-busca > svg{position:absolute;left:11px;top:19px;transform:translateY(-50%);color:var(--texto-inativo);pointer-events:none}
.colab-busca input{padding-left:34px}
.colab-lista{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--superficie);border:1px solid var(--linha-2);border-radius:var(--raio-card);box-shadow:var(--sombra-flutuante);padding:4px;display:flex;flex-direction:column;max-height:264px;overflow-y:auto}
.colab-lista button{display:flex;align-items:center;gap:10px;padding:7px 8px;border:0;border-radius:8px;background:none;text-align:left;color:var(--texto)}
.colab-lista button:hover,.colab-lista button[aria-selected="true"]{background:rgb(var(--ouro-rgb)/.08)}
.colab-lista button span{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.colab-lista b{font-weight:500;font-size:13px}
.colab-lista small{font-size:11.5px;color:var(--texto-inativo)}
.colab-lista kbd{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--texto-inativo);border:1px solid var(--linha-2);border-radius:4px;padding:1px 5px}
.vazio-lista{font-size:12.5px;color:var(--texto-inativo);padding:8px 10px}
.fila-item.free{border-color:rgb(var(--ouro-rgb)/.5);background:linear-gradient(180deg,rgb(var(--ouro-rgb)/.08),rgb(var(--ouro-rgb)/0) 160px),var(--superficie)}
.selo-free{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;background:rgb(var(--ouro-rgb)/.14);border:1px solid rgb(var(--ouro-rgb)/.45);color:var(--ouro-texto)}
.selo-free svg{width:14px;height:14px}
.dica-base{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--texto-apagado);padding:9px 12px;border-radius:10px;background:var(--campo);border:1px solid var(--linha)}
.dica-base > svg{color:var(--dourado)}
.dica-base a,.link-base{color:var(--ouro-texto);text-decoration:none;display:inline-flex;align-items:center;gap:5px;font-weight:500}
.dica-base a:hover,.link-base:hover{text-decoration:underline}
.dica-base a svg,.link-base svg{width:14px;height:14px}
.base-cel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1 1 300px;min-width:0}
.base-ok{display:flex;flex-direction:column;gap:1px}
.base-ok small{font-size:11.5px;color:var(--texto-inativo)}
.base-form{display:flex;gap:6px;flex:1;min-width:0;flex-wrap:wrap}
.base-form input{flex:1 1 220px;min-width:0}

/* Sidebar recolhível */
.marca{flex-direction:row;align-items:flex-start;justify-content:space-between;gap:8px}
.marca-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.mono{display:none;width:34px;height:34px;border-radius:10px;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:rgb(var(--ouro-rgb)/.12);border:1px solid rgb(var(--ouro-rgb)/.35);color:var(--ouro-texto)}
.nav button{position:relative}
.app{transition:grid-template-columns .3s var(--ease-mac)}
.app.recolhida{grid-template-columns:72px minmax(0,1fr)}
.app.recolhida .lateral{padding:16px 10px}
.app.recolhida .marca{flex-direction:column;align-items:center;padding:0;gap:10px}
.app.recolhida .marca-txt,.app.recolhida .nav .rot,.app.recolhida .rodape{display:none}
.app.recolhida .mono{display:grid}
.app.recolhida .nav button{justify-content:center;padding:0}
.app.recolhida .nav .badge{position:absolute;top:1px;right:1px;min-width:17px;height:17px;font-size:10px;padding:0 4px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes entra{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sobe{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .paineis{grid-template-columns:minmax(0,1fr)}
  .fila-item{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .lateral{display:none}
  .app.recolhida{grid-template-columns:minmax(0,1fr)}
  .pop-cal{right:auto;left:0}
  .tons{grid-template-columns:minmax(0,1fr)}
  .detalhe .corpo{display:block;overflow-y:auto}
  .detalhe .col-a,.detalhe .col-b{overflow:visible}
  .detalhe .col-b{border-left:0;border-top:1px solid var(--linha)}
  .logo-movel{display:block;height:15px}
  .topo .titulo h1{font-size:16px}
  .perfil .nome,.perfil .papel{display:none}
  .app.com-nav .conteudo{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .nav-baixo{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--vidro);backdrop-filter:blur(14px);border-top:1px solid var(--linha);
    padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));justify-content:space-around}
  .nav-baixo button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--texto-inativo);font-size:11px;min-width:56px;height:46px;justify-content:center;position:relative}
  .nav-baixo button.ativo{color:var(--texto)}
  .nav-baixo button.ativo svg{color:var(--dourado)}
  .nav-baixo .badge{position:absolute;top:2px;right:8px;font-family:var(--f-mono);font-size:10px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--dourado);color:var(--texto-sobre-ouro);display:grid;place-items:center}
  .dupla{grid-template-columns:minmax(0,1fr)}
  .lista-cli{flex-direction:row;overflow-x:auto}
  .lista-cli button{flex:none}
}
@media (max-width:760px){
  .abas-colunas{display:flex}
  .quadro-wrap{margin:0;padding:0;overflow:visible}
  .quadro{grid-template-columns:minmax(0,1fr);min-width:0}
  .coluna{display:none;min-height:0;background:none;border:0;padding:0}
  .coluna.mostrar{display:flex}
  .coluna header{display:none}
  .card .mover{opacity:1}
  .resumo{gap:8px}
  .resumo .item{padding:10px}
  .resumo .item .n{font-size:22px}
  .resumo .item .rot{font-size:11.5px}
  .filtros select{flex:1;min-width:0}
  .filtros .dica{margin-left:0;width:100%}
  .props{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grade2,.grade3{grid-template-columns:minmax(0,1fr)}
  .detalhe{left:0;top:0;transform:none;width:100%;height:100%;border-radius:0;border:0;animation:fade .2s var(--ease-mac);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .detalhe .cab,.detalhe .acoes-card,.detalhe .col-a,.detalhe .col-b{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .linha-dem{grid-template-columns:auto minmax(0,1fr)}
  .linha-dem .ex{grid-column:2;justify-content:flex-start;flex-wrap:wrap}
  .hist-filtros .campo.mini{flex:1 1 140px}
  .link-box{flex-direction:column}
  .modal{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92%;border-radius:var(--raio-painel) var(--raio-painel) 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .kpi .n{font-size:24px}
  .barras .b{grid-template-columns:minmax(70px,100px) minmax(0,1fr) 54px}
  .topo .acoes .btn.ouro span{display:none}
  .topo .acoes .btn.ouro{width:38px;padding:0}
}

  if (d.status === "concluido") return { k: "concluido", txt: "Concluída", tom: "t-ok" };
  const n = diffDays(d.due, TODAY);
  if (d.status === "em_revisao") return { k: "revisao", txt: n < 0 ? `Prazo era ${fmtDate(d.due)}` : `Prazo ${fmtDate(d.due)}`, tom: "t-neutro" };
  if (n < 0) return { k: "atrasado", txt: `Atrasada · ${plural(-n, "dia", "dias")}`, tom: "t-erro" };
  if (n === 0) return { k: "hoje", txt: "Vence hoje", tom: "t-atencao" };
  if (n === 1) return { k: "prazo", txt: "No prazo · amanhã", tom: "t-ok" };
  return { k: "prazo", txt: `No prazo · ${fmtDate(d.due)}`, tom: "t-ok" };
}
const ordenar = list => list.slice().sort((a, b) => {
  const la = prazo(a).k === "atrasado" ? 0 : 1, lb = prazo(b).k === "atrasado" ? 0 : 1;
  if (la !== lb) return la - lb;
  if (PRIO[a.priority].ord !== PRIO[b.priority].ord) return PRIO[a.priority].ord - PRIO[b.priority].ord;
  return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
});

/* Máquina de estados (espelha as RPCs do banco no plano) */
function destinos(d, papel) {
  const r = [];
  const pendente = ultimaVersao(d)?.status === "pendente";
  if (d.status === "a_fazer") r.push({ para: "em_producao", acao: "iniciar" });
  if (d.status === "ajustes") r.push({ para: "em_producao", acao: "iniciar" });
  if (d.status === "em_producao" || d.status === "ajustes") r.push({ para: "em_revisao", acao: "entregar" });
  if (papel === "gestor") {
    if (d.status === "em_revisao" && pendente) { r.push({ para: "concluido", acao: "aprovar" }); r.push({ para: "ajustes", acao: "ajuste" }); }
    if (d.status === "em_producao") r.push({ para: "a_fazer", acao: "voltar" });
    if (d.status === "concluido") r.push({ para: "ajustes", acao: "reabrir" });
  }
  const dono = envolvido(d);
  if (papel !== "gestor" && !dono) return [];
  if (papel === "gestor" && !dono) return r.filter(x => x.acao !== "iniciar" && x.acao !== "entregar");
  return r;
}
const ultimaVersao = d => d.deliveries[d.deliveries.length - 1];
const pessoas = d => [d.assigneeId, ...(d.participants || [])];
const envolvido = (d, id = S.session) => pessoas(d).includes(id);

function shift(s) {
  const n = diffDays(TODAY, s.seedDay);
  if (!n) return s;
  const ms = n * 864e5, mv = t => t ? new Date(new Date(t).getTime() + ms).toISOString() : t;
  s.demands.forEach(d => {
    d.due = addDays(n, d.due); d.createdAt = mv(d.createdAt); d.completedAt = mv(d.completedAt);
    d.events.forEach(e => e.at = mv(e.at)); d.comments.forEach(c => c.at = mv(c.at));
    d.deliveries.forEach(v => { v.at = mv(v.at); v.reviewedAt = mv(v.reviewedAt); });
  });
  s.seedDay = TODAY; return s;

function parseVideo(url) {

    <div class="item ${atr ? "t-erro" : ""}"><span class="n num">${atr}</span><span class="rot"><span class="dot t-erro"></span>Atrasadas</span></div>

function receberFoto(file) {
  if (!file) return;
  if (!/^image\/(png|jpe?g|webp)$/.test(file.type)) return toast("Envie uma imagem JPG, PNG ou WebP.", true);
  if (file.size > 10 * 1024 * 1024) return toast("A foto pode ter até 10 MB.", true);
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"), T = 160, s = Math.min(img.width, img.height);
      c.width = c.height = T;
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, T, T);
      me().foto = c.toDataURL("image/jpeg", 0.85); commit(); toast("Foto atualizada");
    };
    img.onerror = () => toast("Não deu para ler essa imagem. Tente outra.", true);
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* Indicadores do painel: usados pela tela e pelo modal "Detalhes" */
function painelDados() {
  const P = ui.periodo, desde = addDays(-P + 1);
  const ab = S.demands.filter(d => !d.archived && d.status !== "concluido");
  const versoes = S.demands.flatMap(d => d.deliveries.map(v => ({ d, v })));
  return {
    P, desde,
    abertas: ab,
    atr: ab.filter(d => prazo(d).k === "atrasado").sort((a, b) => a.due < b.due ? -1 : 1),
    prox: ab.filter(d => d.status !== "em_revisao" && diffDays(d.due, TODAY) >= 0 && diffDays(d.due, TODAY) <= 7).sort((a, b) => a.due < b.due ? -1 : 1),
    aguard: ab.filter(d => d.status === "em_revisao" && ultimaVersao(d)?.status === "pendente").sort((a, b) => ultimaVersao(a).at < ultimaVersao(b).at ? -1 : 1),
    entregas: versoes.filter(x => dayOf(x.v.at) >= desde),
    ajustes: versoes.filter(x => x.v.status === "ajuste" && x.v.reviewedAt && dayOf(x.v.reviewedAt) >= desde).sort((a, b) => a.v.reviewedAt < b.v.reviewedAt ? 1 : -1)
  };
}
const barra = (nm, ent, aj, max) => `<div class="b"><span class="nm">${esc(nm)}</span><span class="trilho"><i class="a" style="width:${(Math.max(0, ent - aj) / max) * 100}%"></i><i class="r" style="width:${(Math.min(aj, ent) / max) * 100}%"></i></span><span class="val">${ent}${aj ? ` · ${aj}↺` : ""}</span></div>`;
const barraSimples = (nm, n, max) => `<div class="b"><span class="nm">${esc(nm)}</span><span class="trilho"><i class="a" style="width:${(n / max) * 100}%"></i></span><span class="val">${n}</span></div>`;

  return {

      ${kpi("aguard", "Aguardando aprovação", D.aguard.length, D.aguard.length ? `A mais antiga espera há ${plural(maisAntiga, "dia", "dias")}` : "Fila vazia")}
      ${kpi("ajustes", "Voltaram para ajuste", D.ajustes.length, `De ${plural(D.entregas.length, "entrega", "entregas")} no período`)}
    </div>
    <div class="painel"><header><h2>Demandas abertas por pessoa</h2><span class="muted">situação de hoje · inclui as compartilhadas</span></header>
      <div class="tabela-wrap"><table><thead><tr><th>Pessoa</th><th class="n">A fazer</th><th class="n">Produção</th><th class="n">Revisão</th><th class="n">Ajustes</th><th class="n">Atrasadas</th><th class="n">Total</th></tr></thead>

}

const listaArq = dr => `<div class="lista-arq">${(dr.files || []).map(f => `<div class="it">${f.src ? `<img src="${f.src}" alt="">` : ic("file")}<span class="n">${esc(f.name)}</span><span class="s">${fmtSize(f.size)}</span><button type="button" class="btn icone sm ghost" data-act="rm-arq" data-i="${f.id}" aria-label="Remover">${ic("x")}</button></div>`).join("")}
  ${(dr.rej || []).map(f => `<div class="it rej">${ic("alert")}<span class="n">${esc(f.name)}<br><span class="motivo">${esc(f.motivo)}</span></span></div>`).join("")}</div>`;
const linkUrl = l => `https://demandas.wrmax.com.br/${l.tipo === "convite" ? "convite" : "nova-senha"}/${l.token}`;
const linhaDem = (d, extra) => `<button type="button" class="linha-dem" data-act="abrir" data-id="${d.id}"><span class="cod">${d.code}</span><span class="tt"><b>${esc(d.title)}</b><small>${esc(cli(d.clientId).name)} · ${esc(pessoas(d).map(id => user(id).name.split(" ")[0]).join(", "))}</small></span><span class="ex">${extra}</span></button>`;
function agrupa(itens, chave, nome) {
  const m = new Map(); itens.forEach(x => { const k = chave(x); m.set(k, (m.get(k) || 0) + 1); });
  const arr = [...m.entries()].map(([k, n]) => ({ nome: nome(k), n })).sort((a, b) => b.n - a.n);
  const max = Math.max(1, ...arr.map(x => x.n));
  return `<div class="barras">${arr.map(x => barraSimples(x.nome, x.n, max)).join("")}</div>`;
}
function detalheKpi(k) {
  const D = painelDados();
  const g = (t, html) => `<div class="g"><span class="etiqueta">${t}</span>${html}</div>`;
  if (k === "atrasadas") return { t: "Atrasadas", s: `${plural(D.atr.length, "demanda aberta", "demandas abertas")} fora do prazo, da mais atrasada para a menos`,
    html: `<div class="linhas-dem">${D.atr.map(d => linhaDem(d, seloPrazo(d))).join("")}</div>` };
  if (k === "prox") return { t: "Vencem em 7 dias", s: "Demandas abertas com prazo até " + fmtLong(addDays(7)) + ", fora as que estão em revisão",
    html: `<div class="linhas-dem">${D.prox.map(d => linhaDem(d, `<span class="chip">${NOME_STATUS[d.status]}</span>${seloPrazo(d)}`)).join("")}</div>` };
  if (k === "aguard") return { t: "Aguardando aprovação", s: "Versões entregues que ainda não foram aprovadas nem devolvidas, das mais antigas para as mais novas",
    html: `<div class="linhas-dem">${D.aguard.map(d => { const v = ultimaVersao(d), n = diffDays(TODAY, dayOf(v.at)); return linhaDem(d, `<span class="chip">v${v.version}</span><span class="status ${n >= 2 ? "t-atencao" : ""}"><span class="dot"></span>${n === 0 ? "entregue hoje" : `espera há ${plural(n, "dia", "dias")}`}</span>`); }).join("")}</div>
      <div><button type="button" class="btn" data-act="ir-fila">${ic("inbox")}Abrir a fila de aprovação</button></div>` };
  if (k === "ajustes") return { t: "Voltaram para ajuste", s: `${plural(D.ajustes.length, "versão devolvida", "versões devolvidas")} nos últimos ${D.P} dias, de ${plural(D.entregas.length, "entrega", "entregas")}`,
    html: `<div class="linhas-dem">${D.ajustes.map(x => linhaDem(x.d, `<span class="chip">v${x.v.version}</span><span class="status">${fmtDate(dayOf(x.v.reviewedAt))}</span>`) .replace("</small></span>", `</small><small style="color:var(--texto)">"${esc(x.v.reviewComment)}"</small></span>`)).join("")}</div>` };
  return { t: "", s: "", html: "" };
}

/* ---------- render ---------- */
const root = document.getElementById("app");
function render() {
  const ae = document.activeElement, foco = ae && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const qw = document.getElementById("quadro-wrap"), sx = qw ? qw.scrollLeft : 0;
  const sc = ["det-a", "det-b", "det-corpo"].map(i => { const x = document.getElementById(i); return x ? x.scrollTop : 0; });
  const mc = document.querySelector(".modal .corpo"), my = mc ? mc.scrollTop : 0;
  if (S.session && !me()?.active) S.session = null;
  aplicarPrefs();
  root.innerHTML = S.session ? shell() + (ui.drawer ? gaveta() : "") + modal() + menuMover() + menuUser() : login();
  const qw2 = document.getElementById("quadro-wrap"); if (qw2) qw2.scrollLeft = sx;
  ["det-a", "det-b", "det-corpo"].forEach((i, k) => { const x = document.getElementById(i); if (x) x.scrollTop = sc[k]; });
  const mc2 = document.querySelector(".modal .corpo"); if (mc2) mc2.scrollTop = my;
  if (foco) { const el = document.getElementById(foco.id); if (el) { el.focus({ preventScroll: true }); try { if (foco.s != null) el.setSelectionRange(foco.s, foco.e); } catch (e) {} } }
  ligarArquivos();
}
let toastT;
function toast(txt, aviso) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div"); el.className = "toast" + (aviso ? " aviso" : ""); el.setAttribute("role", "status");
  el.innerHTML = ic(aviso ? "alert" : "check") + `<span>${esc(txt)}</span>`;
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3400);
}
const commit = () => { save(); render(); };
const evento = (d, text) => d.events.push({ at: new Date().toISOString(), actor: S.session, text });

/* ---------- ações ---------- */
function iniciar(d) {
  if (!destinos(d, me().role).some(x => x.acao === "iniciar")) return toast("Só quem está na demanda pode iniciá-la.", true);
  const de = d.status; d.status = "em_producao"; evento(d, `${de === "ajustes" ? "Retomou" : "Iniciou"} a produção · moveu para Em produção`);
  ui.col = "em_producao"; commit(); toast(`${d.code} em produção`);
}
function abrirEntrega(d) { ui.draft = { files: [], rej: [], video: "", nota: "" }; ui.erro = ""; ui.modal = { tipo: "entregar", id: d.id }; ui.menu = null; render(); }
function confirmarEntrega() {
  const d = dem(ui.modal.id), dr = ui.draft;
  const vid = parseVideo(dr.video);
  if (vid && vid.erro) { ui.erro = "Corrija o link do vídeo ou apague o campo."; return render(); }
  if (!(dr.files || []).length && !vid) { ui.erro = "Anexe pelo menos um arquivo ou cole o link do vídeo."; return render(); }
  const n = d.deliveries.length + 1;
  d.deliveries.push({ version: n, at: new Date().toISOString(), by: S.session, note: (dr.nota || "").trim(), files: dr.files.map(f => ({ id: f.id, name: f.name, kind: f.kind, size: f.size })), video: vid, status: "pendente", reviewComment: "", reviewedBy: null, reviewedAt: null });
  d.status = "em_revisao"; evento(d, `Entregou v${n} · moveu para Em revisão`);
  ui.modal = null; ui.draft = {}; ui.col = "em_revisao"; commit(); toast(`v${n} entregue. ${d.code} foi para Em revisão.`);
}
function aprovar(d) {
  const v = ultimaVersao(d);
  if (!ehGestor() || d.status !== "em_revisao" || !v || v.status !== "pendente") return toast("Só o gestor aprova uma versão em revisão.", true);
  v.status = "aprovada"; v.reviewedBy = S.session; v.reviewedAt = new Date().toISOString();
  d.status = "concluido"; d.completedAt = v.reviewedAt; evento(d, `Aprovou v${v.version} · moveu para Concluído`);
  ui.menu = null; commit(); toast(`v${v.version} aprovada. ${d.code} concluída.`);
}
function abrirAjuste(d) { ui.draft = { ajuste: "" }; ui.erro = ""; ui.modal = { tipo: "ajuste", id: d.id }; ui.menu = null; render(); }
function confirmarAjuste() {
  const d = dem(ui.modal.id), v = ultimaVersao(d), txt = (ui.draft.ajuste || "").trim();
  if (txt.length < 10) { ui.erro = "Explique o ajuste com pelo menos 10 caracteres."; return render(); }
  v.status = "ajuste"; v.reviewComment = txt; v.reviewedBy = S.session; v.reviewedAt = new Date().toISOString();
  d.comments.push({ id: uid("m"), authorId: S.session, body: txt, kind: "ajuste", version: v.version, at: v.reviewedAt });
  d.status = "ajustes"; evento(d, `Pediu ajuste em v${v.version} · moveu para Ajustes`);
  ui.modal = null; ui.draft = {}; commit(); toast(`${d.code} voltou para Ajustes com o seu comentário.`);
}
function mover(d, para, acao) {
  ui.menu = null;
  if (acao === "iniciar") return iniciar(d);
  if (acao === "entregar") return abrirEntrega(d);
  if (acao === "aprovar") return aprovar(d);
  if (acao === "ajuste") return abrirAjuste(d);
  if (acao === "voltar") { d.status = "a_fazer"; evento(d, "Moveu para A fazer"); commit(); return toast(`${d.code} voltou para A fazer`); }
  if (acao === "reabrir") { const v = ultimaVersao(d); d.status = "ajustes"; d.completedAt = null; if (v) { v.status = "ajuste"; v.reviewComment = v.reviewComment || "Reaberta pelo gestor."; }
    evento(d, "Reabriu a demanda · moveu para Ajustes"); commit(); return toast(`${d.code} reaberta`); }
}
function criar() {
  const dr = ui.draft;
  const falta = [!dr.titulo?.trim() && "título", !dr.cli && "cliente", !dr.resp && "responsável", !dr.tipo && "tipo de entrega", !dr.brief?.trim() && "briefing"].filter(Boolean);
  if (falta.length) { ui.erro = `Preencha: ${falta.join(", ")}.`; return render(); }
  const id = uid("d"), code = "D-" + (S.nextCode++);
  const d = { id, code, clientId: dr.cli, assigneeId: dr.resp, participants: colabValidos(dr), typeId: dr.tipo, title: dr.titulo.trim(), briefing: dr.brief.trim(), priority: dr.prio || "normal", due: dr.prazo || addDays(3), status: "a_fazer",
    createdAt: new Date().toISOString(), createdBy: S.session, completedAt: null, archived: false, comments: [], events: [], deliveries: [],
    refs: (dr.files || []).map(f => ({ id: f.id, name: f.name, kind: f.kind, size: f.size })),
    checklist: (dr.ck || "").split("\n").map(s => s.trim()).filter(Boolean).map(text => ({ id: uid("k"), text, done: false })) };
  evento(d, `Criou a demanda e atribuiu a ${user(d.assigneeId).name}${d.participants.length ? " com " + d.participants.map(p => user(p).name).join(", ") : ""}`);
  S.demands.push(d); ui.modal = null; ui.draft = {}; ui.col = "a_fazer"; commit(); toast(`${code} criada para ${user(d.assigneeId).name.split(" ")[0]}`);
}

/* arquivos (entrega e referências) */
function receberArquivos(lista) {
  const dr = ui.draft; dr.files = dr.files || []; dr.rej = [];
  [...lista].forEach(file => {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    if (!TIPOS_ACEITOS[ext]) return dr.rej.push({ name: file.name, motivo: "Tipo não aceito. Envie PDF, DOCX, JPG ou PNG (vídeo vai por link)." });
    if (file.size > LIMITE) return dr.rej.push({ name: file.name, motivo: `Tem ${fmtSize(file.size)}. O limite é 50 MB por arquivo.` });
    const id = uid("f"), kind = ext === "pdf" ? "pdf" : ext === "docx" ? "docx" : "img";
    let src = null; if (kind === "img") { try { src = URL.createObjectURL(file); MEM[id] = src; } catch (e) {} }
    dr.files.push({ id, name: file.name, size: file.size, kind, src });
  });
  render();
}
function ligarArquivos() {
  const fi = document.getElementById("foto-input"); if (fi) fi.onchange = () => receberFoto(fi.files[0]);
  const inp = document.getElementById("arq-input"), zona = document.getElementById("zona");
  if (inp) inp.onchange = () => { receberArquivos(inp.files); };
  if (zona) {
    zona.ondragover = e => { e.preventDefault(); zona.classList.add("sobre"); };
    zona.ondragleave = () => zona.classList.remove("sobre");
    zona.ondrop = e => { e.preventDefault(); zona.classList.remove("sobre"); if (e.dataTransfer?.files?.length) receberArquivos(e.dataTransfer.files); };
  }
}

/* ---------- convites e senhas ---------- */
function novoLink(u, tipoLink) {
  const abc = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let tk = "";
  try { const a = new Uint32Array(22); crypto.getRandomValues(a); a.forEach(n => tk += abc[n % abc.length]); } catch (e) { for (let i = 0; i < 22; i++) tk += abc[Math.floor(Math.random() * abc.length)]; }
  u.link = { tipo: tipoLink, token: tk, expira: new Date(Date.now() + 24 * 36e5).toISOString() };
}
function copiarLink() {
  const inp = document.getElementById("link-url"); if (!inp) return;
  const ok = () => toast("Link copiado. Agora é só enviar para a pessoa.");
  const falha = () => { inp.focus(); inp.select(); toast("Não deu para copiar sozinho: o link está selecionado, use Ctrl+C.", true); };
  try { navigator.clipboard.writeText(inp.value).then(ok, falha); } catch (e) { falha(); }
}

/* ---------- eventos ---------- */
const limparFiltros = () => { ui.fCli = ""; ui.fUser = ""; ui.fTipo = ""; ui.fColega = ""; ui.busca = ""; };
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (ui.menu && !e.target.closest(".menu") && !(el && el.dataset.act === "menu")) { ui.menu = null; if (!el) return render(); }
  if (ui.userMenu && !e.target.closest(".menu-user") && !(el && el.dataset.act === "menu-user")) { ui.userMenu = false; if (!el) return render(); }
  if (ui.calAberto && !e.target.closest(".cal-wrap")) { ui.calAberto = false; if (!el) return render(); }
  if (ui.draft && ui.draft.colabAberto && !e.target.closest(".colab-busca")) { ui.draft.colabAberto = false; if (!el) return render(); }
  if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id, d = id ? dem(id) : null;
  switch (a) {
    case "entrar": S.session = id; ui.view = null; limparFiltros(); ui.drawer = null; commit(); break;
    case "perfil": ui.userMenu = false; S.session = null; ui.drawer = null; ui.modal = null; commit(); break;
    case "nav": ui.view = el.dataset.v; limparFiltros(); ui.drawer = null; render(); window.scrollTo(0, 0); break;
    case "abrir": ui.drawer = id; ui.menu = null; if (ui.modal && ui.modal.tipo === "kpi") ui.modal = null; render(); break;
    case "fechar": ui.drawer = null; render(); break;
    case "fechar-modal": ui.modal = null; ui.erro = ""; render(); break;
    case "col": ui.col = el.dataset.col; render(); break;
    case "colega": ui.fColega = ui.fColega === id ? "" : id; render(); break;
    case "menu": { const r = el.getBoundingClientRect(); const w = 240; ui.menu = { id, x: Math.max(8, Math.min(r.right - w, innerWidth - w - 8)), y: Math.min(r.bottom + 6, innerHeight - 220) }; render(); break; }
    case "mover": mover(d, el.dataset.para, el.dataset.acao); break;
    case "iniciar": iniciar(d); break;
    case "entregar": abrirEntrega(d); break;
    case "confirmar-entrega": confirmarEntrega(); break;
    case "aprovar": aprovar(d); break;
    case "pedir-ajuste": abrirAjuste(d); break;
    case "confirmar-ajuste": confirmarAjuste(); break;
    case "reabrir": mover(d, "ajustes", "reabrir"); break;
    case "nova": ui.draft = { prio: "normal", prazo: addDays(3), files: [], rej: [], part: [] }; ui.erro = ""; ui.modal = { tipo: "nova" }; render(); break;
    case "nd-prio": ui.draft.prio = el.dataset.p; render(); break;
    case "nd-part": { const p = ui.draft.part || (ui.draft.part = []); if (!p.includes(id)) p.push(id); ui.draft.part = colabValidos(ui.draft); ui.draft.colabQ = ""; render(); document.getElementById("nd-colab")?.focus(); break; }
    case "nd-rm-part": ui.draft.part = (ui.draft.part || []).filter(x => x !== id); render(); break;
    case "colab-abrir": if (!ui.draft.colabAberto) { ui.draft.colabAberto = true; render(); } break;
    case "criar": criar(); break;
    case "rm-arq": ui.draft.files = (ui.draft.files || []).filter(f => f.id !== el.dataset.i); render(); break;
    case "preview": { const dd = dem(el.dataset.ctx); const all = dd ? [...dd.refs, ...dd.deliveries.flatMap(v => v.files)] : []; const f = all.find(x => x.id === el.dataset.f); if (f) { ui.modal = { tipo: "preview", f }; render(); } break; }
    case "periodo": ui.periodo = Number(el.dataset.n); render(); break;
    case "kpi": ui.modal = { tipo: "kpi", k: el.dataset.k }; render(); break;
    case "ir-fila": ui.modal = null; ui.view = "aprovacoes"; render(); window.scrollTo(0, 0); break;
    case "h-origem": ui.hist.origem = el.dataset.o; render(); break;
    case "h-preset": { const n = Number(el.dataset.n); ui.hist.de = n ? addDays(-n + 1) : ""; ui.hist.ate = ""; render(); break; }
    case "h-limpar": ui.hist = { de: "", ate: "", origem: "", cli: "", tipo: "", pessoa: "" }; ui.calAberto = false; ui.busca = ""; render(); break;
    case "cad": ui.cadTab = el.dataset.tab; render(); break;
    case "toggle-cli": { const c = S.clients.find(x => x.id === id); c.active = !c.active; commit(); break; }
    case "toggle-tipo": { const t = S.types.find(x => x.id === id); t.active = !t.active; commit(); break; }
    case "toggle-user": { const u = S.users.find(x => x.id === id); u.active = !u.active; if (!u.active) u.link = null; commit(); toast(u.active ? `${u.name} voltou a ter acesso` : `${u.name} perdeu o acesso na hora`); break; }
    case "ver-link": { const u = S.users.find(x => x.id === id); if (!u.link || !horasRestantes(u)) { novoLink(u, "convite"); save(); } ui.modal = { tipo: "link", id }; render(); break; }
    case "novo-link": { const u = S.users.find(x => x.id === id); novoLink(u, "convite"); ui.modal = { tipo: "link", id }; commit(); toast("Novo link gerado. O anterior não funciona mais."); break; }
    case "cancelar-convite": { const u = S.users.find(x => x.id === id); S.users = S.users.filter(x => x.id !== id); commit(); toast(`Convite de ${u.name} cancelado`); break; }
    case "reset-senha": { const u = S.users.find(x => x.id === id); novoLink(u, "senha"); ui.modal = { tipo: "link", id }; commit(); break; }
    case "testar-link": ui.erro = ""; ui.modal = { tipo: "senha-nova", id }; render(); break;
    case "copiar": copiarLink(); break;
    case "f-aprov": ui.fAprov = el.dataset.o; render(); break;
    case "base-editar": ui.editBase = id; render(); document.getElementById("base-" + id)?.focus(); break;
    case "base-cancelar": ui.editBase = null; render(); break;
    case "menu-user": ui.userMenu = !ui.userMenu; render(); break;
    case "config": ui.userMenu = false; ui.modal = { tipo: "config" }; render(); break;
    case "sair": ui.userMenu = false; S.session = null; ui.drawer = null; ui.modal = null; commit(); toast("Você saiu."); break;
    case "pref-tema": prefs().tema = el.dataset.v; commit(); break;
    case "pref-tom": prefs().tom = el.dataset.v; commit(); break;
    case "rm-foto": delete me().foto; commit(); toast("Foto removida"); break;
    case "side": ui.sideRec = !ui.sideRec; try { localStorage.setItem(KEY + "-side", ui.sideRec ? "1" : ""); } catch (er) {} render(); break;
    case "tog-hist": ui.histFechado = !ui.histFechado; render(); break;
    case "cal": ui.calAberto = !ui.calAberto; render(); break;
    case "tema": { const h = document.documentElement, t = h.getAttribute("data-theme"); const prox = !t ? "dark" : t === "dark" ? "light" : null; if (prox) h.setAttribute("data-theme", prox); else h.removeAttribute("data-theme"); try { localStorage.setItem(KEY + "-tema", prox || ""); } catch (er) {} render(); break; }
    case "reset": S = seed(); ui.view = null; ui.drawer = null; ui.modal = null; limparFiltros(); commit(); toast("Dados de exemplo restaurados"); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.filtro) { ui[t.dataset.filtro] = t.value; render(); }
  if (t.dataset.hist) { ui.hist[t.dataset.hist] = t.value; render(); }
  if (t.dataset.ck) { const d = dem(ui.drawer); const c = d.checklist.find(x => x.id === t.dataset.ck); c.done = t.checked; evento(d, `${c.done ? "Marcou" : "Desmarcou"} "${c.text}" no checklist`); commit(); }
  if (t.dataset.papel) { const u = S.users.find(x => x.id === t.dataset.papel); u.role = t.value; commit(); toast(`${u.name} agora é ${papelNome(t.value).toLowerCase()}`); }
  if (t.dataset.draft && t.tagName === "SELECT") { ui.draft[t.dataset.draft] = t.value; if (t.dataset.draft === "resp") { ui.draft.part = colabValidos(ui.draft); ui.draft.colabAberto = false; render(); } }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.draft && t.tagName !== "SELECT") {
    ui.draft[t.dataset.draft] = t.value;
    if (t.dataset.draft === "colabQ") { ui.draft.colabAberto = true; render(); }
    if (t.dataset.draft === "video") { const p = document.getElementById("video-prev"); const v = parseVideo(t.value); if (p) p.innerHTML = v ? (v.erro ? `<span class="erro-txt">${esc(v.erro)}</span>` : videoBox(v)) : ""; }
  }
  if (t.hasAttribute("data-busca")) { ui.busca = t.value; render(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, k = f.dataset.form, val = (f.elements.txt || f.elements.nome)?.value?.trim();
  const d = dem(ui.drawer);
  if (k === "add-ck" && val) { d.checklist.push({ id: uid("k"), text: val, done: false }); evento(d, `Adicionou "${val}" ao checklist`); commit(); }
  if (k === "add-com" && val) { d.comments.push({ id: uid("m"), authorId: S.session, body: val, kind: "comentario", at: new Date().toISOString() }); commit(); }
  if (k === "add-cli" && val) {
    const url = f.elements.base.value.trim();
    if (!notionOk(url)) return toast("Cole o link de uma página do Notion (notion.so ou notion.site).", true);
    S.clients.push({ id: uid("c"), name: val, active: true, base: { url, por: S.session, em: new Date().toISOString() } }); commit(); toast(`${val} cadastrado com a base do Notion`);
  }
  if (k === "base-cli") {
    const c = S.clients.find(x => x.id === f.dataset.id), url = f.elements.url.value.trim();
    if (!notionOk(url)) return toast("Cole o link de uma página do Notion (notion.so ou notion.site).", true);
    c.base = { url, por: S.session, em: new Date().toISOString() }; ui.editBase = null; commit(); toast(`Base de ${c.name} atualizada`);
  }
  if (k === "add-tipo" && val) { S.types.push({ id: uid("t"), name: val, active: true }); commit(); toast(`Tipo "${val}" criado`); }
  if (k === "add-user" && val) {
    const email = f.elements.email.value.trim(), role = f.elements.papel.value;
    if (S.users.some(u => u.email.toLowerCase() === email.toLowerCase())) return toast("Já existe uma pessoa com esse e-mail.", true);
    const u = { id: uid("u"), name: val, email, role, cargo: f.elements.cargo.value.trim() || (role === "freelancer" ? "Freelancer" : ""), active: true, pendente: true };
    novoLink(u, "convite"); S.users.push(u); ui.modal = { tipo: "link", id: u.id }; commit();
  }
  if (k === "definir-senha") {
    const u = S.users.find(x => x.id === ui.modal.id), s1 = f.elements.s1.value, s2 = f.elements.s2.value;
    if (!u.link || !horasRestantes(u)) { ui.erro = "Este link expirou. Peça um novo ao gestor."; return render(); }
    if (s1.length < 12) { ui.erro = "A senha precisa ter pelo menos 12 caracteres."; return render(); }
    if (s1 !== s2) { ui.erro = "As duas senhas não são iguais."; return render(); }
    const conv = u.link.tipo === "convite"; u.pendente = false; u.link = null; ui.modal = null; ui.erro = ""; commit();
    toast(conv ? `${u.name.split(" ")[0]} criou a senha e já pode entrar.` : `Nova senha de ${u.name.split(" ")[0]} salva. O link foi invalidado.`);
  }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "nd-colab" && (e.key === "Enter" || e.key === "Escape")) {
    e.preventDefault();
    if (e.key === "Escape") { ui.draft.colabAberto = false; render(); return; }
    const r = colabResultados(ui.draft); if (r.itens[0]) { ui.draft.part = [...(ui.draft.part || []), r.itens[0].id]; ui.draft.colabQ = ""; render(); }
    return;
  }
  if (e.key !== "Escape") return;
  if (ui.userMenu || ui.calAberto) { ui.userMenu = false; ui.calAberto = false; render(); } else if (ui.menu) { ui.menu = null; render(); } else if (ui.modal) { ui.modal = null; render(); } else if (ui.drawer) { ui.drawer = null; render(); }
});

/* arrastar e soltar (desktop): só as colunas permitidas aceitam o card */
let arrasto = null;
document.addEventListener("dragstart", e => {
  const c = e.target.closest?.(".card[data-card]"); if (!c) return;
  const d = dem(c.dataset.card); const ds = destinos(d, me().role);
  arrasto = { id: d.id, ds };
  try { e.dataTransfer.setData("text/plain", d.id); e.dataTransfer.effectAllowed = "move"; } catch (er) {}
  c.classList.add("arrastando");
  document.querySelectorAll(".coluna").forEach(col => { const ok = ds.some(x => x.para === col.dataset.col); col.classList.toggle("pode", ok); col.classList.toggle("nao-pode", !ok && col.dataset.col !== d.status); });
});
document.addEventListener("dragend", () => { arrasto = null; document.querySelectorAll(".coluna").forEach(c => c.classList.remove("pode", "nao-pode")); document.querySelectorAll(".arrastando").forEach(c => c.classList.remove("arrastando")); });
document.addEventListener("dragover", e => { if (!arrasto) return; const col = e.target.closest?.(".coluna"); if (col && arrasto.ds.some(x => x.para === col.dataset.col)) e.preventDefault(); });
document.addEventListener("drop", e => {
  if (!arrasto) return; const col = e.target.closest?.(".coluna"); if (!col) return;
  e.preventDefault(); const x = arrasto.ds.find(y => y.para === col.dataset.col); const d = dem(arrasto.id); arrasto = null;
  document.querySelectorAll(".coluna").forEach(c => c.classList.remove("pode", "nao-pode"));
  if (x) mover(d, x.para, x.acao);
});

try { ui.sideRec = localStorage.getItem(KEY + "-side") === "1"; } catch (e) {}
render();
})();
</script>
